<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/brython@3.10.5/brython.min.js"></script>
    <style>
        body {
            text-align: center;
            background-color: rgb(10, 10, 10);
        }
        canvas {
            border: 1px solid rgb(105, 4, 4);
            background-color: rgb(14, 13, 13);
        }
    </style>
</head>
<body onload="brython()">
    <h1 style ="color: grey;">Welcome to Turners Pong Game!</h1>
    <canvas id = "pong" width="1000" height="500"></canvas>

    <script type="text/python">
        from browser import document, window

        canvas = document["pong"]
        ctx = canvas.getContext("2d")

        #ball properties
        ballR = 10
        ball_speedx = 5
        ball_speedy = 5
        ball = {"x": canvas.width/2, "y": canvas.height/2, "dx": ball_speedx, "dy": ball_speedy }

        def drawBall():
            ctx.beginPath()
            ctx.fillStyle = "red"
            ctx.arc(ball["x"], ball["y"], ballR, 0, 2 * window.Math.PI)
            ctx.fill()
            ctx.closePath()
        

        #paddle properties
        p1_width = 15
        p1_length = 100
        paddleSpeed = -25 
        p1 = {"x": canvas.width-p1_width, "y": canvas.height/2 - 50}
        cpu = {"x": 0, "y": canvas.height/2 - 50}

        def drawp1():
            ctx.beginPath()
            ctx.rect(p1["x"], p1["y"], p1_width, p1_length)
            ctx.fillStyle = "blue"
            ctx.fill()
            ctx.closePath()

            
        drawp1()
        def drawcpu():
            ctx.beginPath()
            ctx.rect(cpu["x"],cpu["y"], p1_width,p1_length)
            ctx.fillStyle = "yellow"
            ctx.fill()
            ctx.closePath()
        drawcpu()
        
        #ball movement
        def MoveBall():
            ball["x"] += ball["dx"]
            ball["y"] += ball["dy"]
            if ball["y"] - ballR == 0 or ball["y"] + ballR == canvas.height: #bounces off bottom of canvas
                ball["dy"] = -ball["dy"]
            
            if ball["x"] + ballR >= p1["x"]: 
                if ball["y"] - ballR >= p1["y"] and ball["y"] + ballR <= p1["y"] + p1_length: 
                    ball["dx"] = -ball["dx"]
            
            if ball["x"] - ballR <= cpu["x"] + p1_width:
                if ball["y"] - ballR >= cpu["y"] and ball["y"] + ballR <= cpu["y"] + p1_length: 
                    ball["dx"] = -ball["dx"]
        #PaddleMovement
        def movep1Up():
            if p1["y"] > 0:         
                p1["y"] += paddleSpeed
        def movep1down():
            if p1["y"] < canvas.height - p1_length:         
                p1["y"] -= paddleSpeed

        def on_keydown(event):
            if event.key == "ArrowUp":
                movep1Up()
            if event.key == "ArrowDown": 
                movep1down()

        document.bind("keydown", on_keydown)
        def game():
            ctx.clearRect(0, 0, canvas.width, canvas.height)
            drawBall()
            drawcpu()
            drawp1()
            MoveBall()
        window.setInterval(game, 1000 / 60)
    </script>
</body>
</html>
